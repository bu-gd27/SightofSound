<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Sight of Sound — exhibition guide.">
  <title>Sight of Sound</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme">

    <img class="exhibition-logo" src="assets/sight-of-sound-logo.svg" alt="Sight of Sound">

  <main id="exhibition">
    <section class="exhibition-stage" aria-label="Exhibition groups" tabindex="0">
      <div class="cards-rail" aria-label="Group artwork carousel"><div class="carousel-cylinder"></div></div>
    </section>
  </main>

</html>
