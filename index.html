<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Coming Soon!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="coming-soon">
      <h1>Coming Soon!</h1>
      <div class="morse" role="img" aria-label="Coming Soon in Morse code: dash dot dash dot, dash dash dash, dash dash, dot dot, dash dot, dash dash dash, dot dot dot, dash dash dash, dash dash dash, dash dot">
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dot"></i><i class="dash"></i><i class="dot"></i></span>
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dash"></i><i class="dash"></i></span>
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dash"></i></span>
        <span class="letter" aria-hidden="true"><i class="dot"></i><i class="dot"></i></span>
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dot"></i></span>
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dash"></i><i class="dash"></i></span>
        <span class="word-break" aria-hidden="true"></span>
        <span class="letter" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dash"></i><i class="dash"></i></span>
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dash"></i><i class="dash"></i></span>
        <span class="letter" aria-hidden="true"><i class="dash"></i><i class="dot"></i></span>
      </div>
    </main>
  </body>
</html>
